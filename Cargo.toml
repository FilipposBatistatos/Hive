[package]
name = "Hive"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.127"

[dev-dependencies]
expect-test = "1.5.1"
proptest = "1.11.0"
proptest-derive = "0.8.0"
